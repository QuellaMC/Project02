# The third-party notice the install ships, made with
# `cargo about generate --workspace --fail about.hbs -o THIRD-PARTY-NOTICES.txt`.
# It accepts what deny.toml allows and nothing more, in the order a crate
# offering a choice is taken under: the terms that ask least of a binary first.
accepted = [
    "CC0-1.0",
    "MIT-0",
    "Unlicense",
    "BSL-1.0",
    "Zlib",
    "MIT",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
]
targets = [
    "aarch64-apple-darwin",
    "aarch64-pc-windows-msvc",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }

# The scan misses some crates' texts, and `-L debug` names each as falling
# back to the canonical text. Those are clarified below, from where the text
# is; where there is none to point at, the crate keeps the canonical text: the
# crates published from the objc2 repository, which only names their
# licenses; selectors, whose repository holds no license file; and
# libappindicator-sys, whose package holds none and names no repository.

# Each text below is in the crate, under a name cargo-about does not scan.
