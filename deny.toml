[graph]
targets = [
    "aarch64-apple-darwin",
    "aarch64-pc-windows-msvc",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "a maintenance notice on proc-macro-error, which Tauri depends on through gtk-rs 0.18 on Linux" },
    { id = "RUSTSEC-2026-0370", reason = "a maintenance notice on zvariant, which Tauri's opener and single-instance plugins depend on through zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "a maintenance notice on zbus_names, which Tauri's opener and single-instance plugins depend on through zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "a maintenance notice on zvariant_derive, which Tauri's opener and single-instance plugins depend on through zbus 5" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    # Tauri brings in cssparser, cssparser-macros, dtoa-short, selectors and
    # option-ext. MPL-2.0 asks only that modifications to their files be
    # published, and this project makes none.
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
# The list is the policy for every crate to come, not an inventory of today's.
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
