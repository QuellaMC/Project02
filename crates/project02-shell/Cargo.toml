[package]
name = "project02-shell"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "project02-shell"

[dependencies]
p02-shared.workspace = true
p02-telegram.workspace = true
project02.workspace = true
serde.workspace = true
serde_json.workspace = true
# Declared here, not in the workspace table: Tauri's CLI reads the tray
# feature on this entry to bundle the library the tray loads, and skips an
# inherited one.
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-util.workspace = true

[dev-dependencies]
p02-shared = { workspace = true, features = ["http"] }
tempfile.workspace = true

[build-dependencies]
tauri-build.workspace = true

[lints]
workspace = true
