allow-dbg-in-tests = true
allow-print-in-tests = true
allow-unwrap-in-tests = true
# A name the docs use as a word, beside clippy's own list.
doc-valid-idents = ["AppImage", "OpenAI", "QuickJS", "WebView2", ".."]

# Refused everywhere but the fs seam of p02-shared, which opts in with an
# `expect`. A platform's own functions resolve only on that platform, and
# tokio's only where its `fs` feature is on, hence `allow-invalid` on them.
# A database is opened only by the store crate, whatever crate holds the
# connection afterwards.
disallowed-methods = [
    { path = "std::fs::canonicalize", reason = "files are reached only through the fs seam of p02-shared" },
    { path = "std::fs::copy", reason = "files are reached only through the fs seam of p02-shared" },
    { path = "std::fs::create_dir", reason = "files are reached only through the fs seam of p02-shared" },
    { path = "std::fs::create_dir_all", reason = "files are reached only through the fs seam of p02-shared" },
    { path = "std::fs::exists", reason = "files are reached only through the fs seam of p02-shared" },
    { path = "std::fs::hard_link", reason = "files are reached only through the fs seam of p02-shared" },
    { path = "std::fs::metadata", reason = "files are reached only through the fs seam of p02-shared" },
    { path = "std::fs::read", reason = "files are reached only through the fs seam of p02-shared" },
    { path = "std::fs::read_dir", reason = "files are reached only through the fs seam of p02-shared" },
    { path = "std::fs::read_link", reason = "files are reached only through the fs seam of p02-shared" },
    { path = "std::fs::read_to_string", reason = "files are reached only through the fs seam of p02-shared" },
    { path = "std::fs::remove_dir", reason = "files are reached only through the fs seam of p02-shared" },
    { path = "std::fs::remove_dir_all", reason = "files are reached only through the fs seam of p02-shared" },
    { path = "std::fs::remove_file", reason = "files are reached only through the fs seam of p02-shared" },
    { path = "std::fs::rename", reason = "files are reached only through the fs seam of p02-shared" },
    { path = "std::fs::set_permissions", reason = "files are reached only through the fs seam of p02-shared" },
    { path = "std::fs::set_times", reason = "files are reached only through the fs seam of p02-shared" },
    { path = "std::fs::set_times_nofollow", reason = "files are reached only through the fs seam of p02-shared" },
    { path = "std::fs::soft_link", reason = "files are reached only through the fs seam of p02-shared" },
    { path = "std::fs::symlink_metadata", reason = "files are reached only through the fs seam of p02-shared" },
    { path = "std::fs::write", reason = "files are reached only through the fs seam of p02-shared" },
    { path = "std::path::Path::canonicalize", reason = "files are reached only through the fs seam of p02-shared" },
    { path = "std::path::Path::exists", reason = "files are reached only through the fs seam of p02-shared" },
