    { path = "tokio::fs::symlink_file", reason = "files are reached only through the fs seam of p02-shared", allow-invalid = true },
    { path = "rusqlite::Connection::open", reason = "a database is opened only by the store crate" },
    { path = "rusqlite::Connection::open_in_memory", reason = "a database is opened only by the store crate" },
    { path = "rusqlite::Connection::open_in_memory_with_flags", reason = "a database is opened only by the store crate" },
    { path = "rusqlite::Connection::open_in_memory_with_flags_and_vfs", reason = "a database is opened only by the store crate" },
