    { path = "std::path::Path::metadata", reason = "files are reached only through the fs seam of p02-shared" },
    { path = "std::path::Path::read_dir", reason = "files are reached only through the fs seam of p02-shared" },
    { path = "std::path::Path::read_link", reason = "files are reached only through the fs seam of p02-shared" },
    { path = "std::path::Path::symlink_metadata", reason = "files are reached only through the fs seam of p02-shared" },
    { path = "std::path::Path::try_exists", reason = "files are reached only through the fs seam of p02-shared" },
