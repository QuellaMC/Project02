    { path = "tokio::fs::read", reason = "files are reached only through the fs seam of p02-shared", allow-invalid = true },
    { path = "tokio::fs::read_dir", reason = "files are reached only through the fs seam of p02-shared", allow-invalid = true },
    { path = "tokio::fs::read_link", reason = "files are reached only through the fs seam of p02-shared", allow-invalid = true },
