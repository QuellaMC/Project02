name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable

      - name: Install lint tools
        run: python -m pip install --upgrade pip ruff

      - name: Install TypeScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run TypeScript lint
        run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable

      - name: Install typecheck tools
        run: python -m pip install --upgrade pip mypy

      - name: Install TypeScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run mypy typecheck
        run: mypy src

      - name: Run TypeScript typecheck
        run: pnpm typecheck

  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable

      - name: Install TypeScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile Python sources
        run: python -m compileall src tests

      - name: Run unit tests
        run: python -m unittest discover -s tests/unit -t .

      - name: Run integration tests
        run: python -m unittest discover -s tests/integration -t .

      - name: Run full test discovery
        run: python -m unittest discover -s tests -t .

      - name: Run TypeScript tests
        run: pnpm test

  pull-request-gate:
    name: pull-request-gate
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test
    if: ${{ always() }}

    steps:
      - name: Require ci jobs to pass
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] ||
             [ "${{ needs.typecheck.result }}" != "success" ] ||
             [ "${{ needs.test.result }}" != "success" ]; then
            echo "ci gate failed."
            exit 1
          fi
          echo "ci gate passed."
