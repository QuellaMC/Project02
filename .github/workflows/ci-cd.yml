name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clients:
    name: clients
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browser suite and the conformance suite start the binary.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo's registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-clients-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-clients-${{ runner.os }}-

      - name: Cache Playwright's Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium for the browser suite
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the clients' gate
        run: pnpm check

      - name: Run the conformance suite against the binary
        run: pnpm test:conformance

  rust:
    name: rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install cargo-deny and cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2

      - name: Cache cargo's registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # The shell crate builds against the webview; only Linux's runner lacks its development files.
      - name: Install the webview's development files
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Run Rust quality gate
        run: pnpm check:rust

  pull-request-gate:
    name: pull-request-gate
    runs-on: ubuntu-latest
    needs:
      - clients
      - rust
    if: ${{ always() }}

    steps:
      - name: Require ci jobs to pass
        run: |
          if [ "${{ needs.clients.result }}" != "success" ] || [ "${{ needs.rust.result }}" != "success" ]; then
            echo "ci gate failed."
            exit 1
          fi
          echo "ci gate passed."
