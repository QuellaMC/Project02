[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
rust-version = "1.99"

[workspace.dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23.1"
dunce = "1.0.5"
form_urlencoded = "1.2.2"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
jsonschema = { version = "0.59.0", default-features = false }
p02-app = { path = "crates/p02-app" }
p02-characters = { path = "crates/p02-characters" }
p02-config = { path = "crates/p02-config" }
p02-contracts = { path = "crates/p02-contracts" }
p02-core = { path = "crates/p02-core" }
p02-gateway = { path = "crates/p02-gateway" }
p02-memory = { path = "crates/p02-memory" }
p02-plugins = { path = "crates/p02-plugins" }
p02-role-model = { path = "crates/p02-role-model" }
p02-runtime = { path = "crates/p02-runtime" }
p02-shared = { path = "crates/p02-shared" }
p02-store = { path = "crates/p02-store" }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = { version = "8.12.0", features = ["debug-embed", "mime-guess"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }
serde_path_to_error = "0.1.20"
sha2 = { version = "0.11.1", default-features = false }
socket2 = "0.6.5"
subtle = { version = "2.6.1", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.53.3"
tokio-util = "0.7.20"
tower-service = "0.3.3"
uuid = { version = "1.28.0", features = ["v4"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
pedantic = { level = "warn", priority = -1 }
print_stderr = "warn"
print_stdout = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
