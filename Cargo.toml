[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
rust-version = "1.99"

[workspace.dependencies]
async-trait = "0.1.92"
dunce = "1.0.5"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
jsonschema = { version = "0.59.0", default-features = false }
p02-contracts = { path = "crates/p02-contracts" }
p02-core = { path = "crates/p02-core" }
p02-shared = { path = "crates/p02-shared" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }
sha2 = { version = "0.11.1", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.53.3"
tokio-util = "0.7.20"
uuid = { version = "1.28.0", features = ["v4"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
pedantic = { level = "warn", priority = -1 }
print_stderr = "warn"
print_stdout = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
